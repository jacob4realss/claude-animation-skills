<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const SPEC = __SPEC__;
const PLAN = SPEC._plan;                       // worked out by build.py: one entry per stage, with its times
window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
let built; window.__hf.buildReady.fruitcut = new Promise((r) => { built = r; });
await Promise.all([document.fonts.load('800 168px InterTight'), document.fonts.load('600 42px Inter'), document.fonts.load('500 26px JB')]);
const W = 1080, H = 1920;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const out3 = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const inOut2 = (x) => { x = clamp(x, 0, 1); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1); renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = .8;
const key = new THREE.DirectionalLight(0xfff1e0, 2.4); key.position.set(-4.5, 10, 5.5); scene.add(key);
scene.add(new THREE.HemisphereLight(0xe8eeff, 0x3a2a1c, .7));
const camera = new THREE.PerspectiveCamera(30, W / H, .3, 200);

// ------------------------------------------------------------ fruits: shape (radii) and how deep the peel and rind go
const FRUITS = {
  watermelon: { id: 0, r: [1.45, 1.0, 1.02], label: 'WATERMELON' },
  orange:     { id: 1, r: [1.0, .94, 1.0],   label: 'ORANGE' },
  apple:      { id: 2, r: [1.04, .96, 1.04], label: 'APPLE' },
  kiwi:       { id: 3, r: [1.3, .86, .9],    label: 'KIWI' },
};
const F = FRUITS[SPEC.fruit];
const RAD = new THREE.Vector3(...F.r);
const BND = RAD.clone().multiplyScalar(1.03);   // bounding ellipsoid the cut grid spans (slightly bigger than the fruit)
const CY = RAD.y;                                // fruit centre height: it rests on the board at y = 0

// ------------------------------------------------------------ the board
{
  const c = document.createElement('canvas'); c.width = 1024; c.height = 1024; const x = c.getContext('2d');
  x.fillStyle = '#c79a6a'; x.fillRect(0, 0, 1024, 1024);
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 420; i++) {               // long grain lines
    const y = rnd() * 1024, a = .03 + rnd() * .09, wv = 4 + rnd() * 14;
    x.strokeStyle = rnd() < .5 ? `rgba(120,78,40,${a})` : `rgba(255,226,180,${a * .8})`; x.lineWidth = .6 + rnd() * 2.4;
    x.beginPath(); for (let k = 0; k <= 1024; k += 16) x.lineTo(k, y + Math.sin(k / 160 + y) * wv); x.stroke();
  }
  for (let i = 0; i < 260; i++) { x.strokeStyle = `rgba(80,50,25,${.05 + rnd() * .08})`; x.lineWidth = .5; const px = rnd() * 1024, py = rnd() * 1024, l = 20 + rnd() * 120, a = (rnd() - .5) * .6;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke(); }   // knife marks
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  const top = new THREE.MeshStandardMaterial({ map: t, roughness: .62, metalness: 0 });
  const side = new THREE.MeshStandardMaterial({ color: 0x8e6339, roughness: .7 });
  const board = new THREE.Mesh(new THREE.BoxGeometry(8.4, .36, 7.2), [side, side, top, side, side, side]);
  board.position.y = -.18; scene.add(board);
  const table = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x2a221b, roughness: .9 }));
  table.rotation.x = -Math.PI / 2; table.position.y = -.36; scene.add(table);
}
// soft contact shadow under the fruit, grows as the pieces spread
const shadowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  const g = x.createRadialGradient(128, 128, 0, 128, 128, 128); g.addColorStop(0, 'rgba(0,0,0,.62)'); g.addColorStop(.55, 'rgba(0,0,0,.32)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(c); })();
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2; shadow.position.y = .003; scene.add(shadow);
// juice: once the pieces are far finer than a pixel the fruit is really a purée, so a glossy puddle spreads under it
const JUICE = { watermelon: '#a8101f', orange: '#d86a04', apple: '#c9ae55', kiwi: '#5a8a0c' }[SPEC.fruit];
const juiceTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  const g = x.createRadialGradient(256, 256, 0, 256, 256, 256); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.7, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.beginPath();
  for (let a = 0; a <= 64; a++) { const t = a / 64 * Math.PI * 2, r = 230 + 18 * Math.sin(t * 5 + 1) + 10 * Math.sin(t * 11); x.lineTo(256 + Math.cos(t) * r, 256 + Math.sin(t) * r); }
  x.fill(); return new THREE.CanvasTexture(c); })();
const juice = new THREE.Mesh(new THREE.CircleGeometry(.5, 64), new THREE.MeshStandardMaterial({ color: JUICE, alphaMap: juiceTex, transparent: true,
  roughness: .3, metalness: 0, envMapIntensity: .35, depthWrite: false }));
juice.rotation.x = -Math.PI / 2; juice.position.y = .006; scene.add(juice);

// ------------------------------------------------------------ the pieces: one box per piece, the fruit is ray-marched inside it
// Each piece is (its grid cell) ∩ (the fruit). The fragment shader marches the fruit's signed distance field inside the box,
// so the peel, the rind and the flesh on every cut face are exact for any number of pieces, and motion is all on the GPU.
const VERT = /* glsl */`
attribute vec4 aCell;   // x0 z0 x1 z1
attribute vec4 aInfo;   // ylo yhi i j
attribute float aSeed;
uniform vec2 uB; uniform float uDx, uDz, uGapX, uGapZ, uBloom, uLoose, uDropY, uSpread;
flat out mat3 vR; flat out vec3 vP; flat out vec3 vO; flat out vec3 vBmin; flat out vec3 vBmax;
out vec3 vW;
mat3 rotAxis(vec3 k, float a){ float c = cos(a), s = sin(a), t = 1. - c; return mat3(
  t*k.x*k.x + c,     t*k.x*k.y + s*k.z, t*k.x*k.z - s*k.y,
  t*k.x*k.y - s*k.z, t*k.y*k.y + c,     t*k.y*k.z + s*k.x,
  t*k.x*k.z + s*k.y, t*k.y*k.z - s*k.x, t*k.z*k.z + c); }
void main(){
  vec2 c = .5*(aCell.xy + aCell.zw), hw = .5*(aCell.zw - aCell.xy);
  // the cut lines open a hairline gap as the blade passes them
  vec3 O = vec3(uGapX*(min(aInfo.z, uDx) - .5*uDx), uDropY, uGapZ*(min(aInfo.w, uDz) - .5*uDz));
  float r = length(c/uB);
  vec2 dir = length(c) > 1e-5 ? normalize(c) : vec2(0.);
  float h1 = fract(aSeed*7.131), h2 = fract(aSeed*13.77), h3 = fract(aSeed*3.917);
  // pieces fall outward: the outer ones first and flat, the middle ones stand (looser = more of them fall)
  float theta = radians(89.)*smoothstep(.04 - .3*uLoose, .62 - .5*uLoose, r + .08*(h1 - .5)) * (.92 + .08*h3);
  float delay = .16*(1. - clamp(r, 0., 1.)) + .1*h2;
  float dur = .38 + .14*h1;
  float p = clamp((uBloom - delay)/dur, 0., 1.);
  float fall = p*p;
  float land = max(uBloom - delay - dur, 0.);
  float ang = theta*(fall - step(1., p)*sin(land*20.)*exp(-land*10.)*.07);
  float dq = clamp(uBloom/.22, 0., 1.);
  O.y -= aInfo.x*dq*dq;                        // drop to the board
  O.xz += dir*uSpread*r*fall*(.7 + .6*h2);     // and slide out a little
  O.xz -= dir*.5*(aInfo.y - aInfo.x)*sin(ang)*clamp(2.*hw.x/(aInfo.y - aInfo.x + 1e-3) + .3, 0., 1.); // chunky pieces roll rather than pivot
  vec3 P = vec3(c.x + dir.x*(hw.x*abs(dir.x) + hw.y*abs(dir.y)), aInfo.x, c.y + dir.y*(hw.x*abs(dir.x) + hw.y*abs(dir.y)));
  vec3 k = length(dir) > 0. ? normalize(vec3(dir.y, 0., -dir.x)) : vec3(1., 0., 0.);
  vR = rotAxis(k, ang); vP = P; vO = O;
  vBmin = vec3(aCell.x, aInfo.x, aCell.y); vBmax = vec3(aCell.z, aInfo.y, aCell.w);
  vec3 po = mix(vBmin - .003, vBmax + .003, position);
  vec3 pw = vR*(po - P) + P + O;
  vW = pw;
  gl_Position = projectionMatrix*viewMatrix*vec4(pw, 1.);
}`;
const FRAG = /* glsl */`
precision highp float;
flat in mat3 vR; flat in vec3 vP; flat in vec3 vO; flat in vec3 vBmin; flat in vec3 vBmax;
in vec3 vW;
uniform mat4 projectionMatrix;
uniform int uFruit; uniform vec3 uRad; uniform float uCy;
float hash(vec3 p){ p = fract(p*.3183099 + .1); p *= 17.; return fract(p.x*p.y*p.z*(p.x + p.y + p.z)); }
float noise(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*(3. - 2.*f);
  return mix(mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x), mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x), mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z); }
float fbm(vec3 p){ return .5*noise(p) + .25*noise(p*2.03) + .125*noise(p*4.01); }
float sdEll(vec3 p, vec3 r){ float k0 = length(p/r), k1 = length(p/(r*r)); return k0*(k0 - 1.)/k1; }
float smax(float a, float b, float k){ float h = clamp(.5 - .5*(b - a)/k, 0., 1.); return mix(b, a, h) + k*h*(1. - h); }
float sdf(vec3 p){
  vec3 q = p - vec3(0., uCy, 0.);
  float d = sdEll(q, uRad);
  if (uFruit == 2) {                            // apple: dimples at the stem and the base
    d = smax(d, -(length(q - vec3(0., uRad.y + .12, 0.)) - .3), .16);
    d = smax(d, -(length(q - vec3(0., -uRad.y - .2, 0.)) - .3), .12);
  }
  return d;
}
vec3 nrm(vec3 p){ const vec2 e = vec2(.0015, -.0015);
  return normalize(e.xyy*sdf(p + e.xyy) + e.yyx*sdf(p + e.yyx) + e.yxy*sdf(p + e.yxy) + e.xxx*sdf(p + e.xxx)); }
vec3 lin(vec3 c){ return pow(c, vec3(2.2)); }
// seeds: a jittered lattice, one candidate per cell
float seeds(vec3 u, float scale, vec3 stretch, float size){
  vec3 g = u*scale, i = floor(g), f = fract(g);
  vec3 o = vec3(hash(i), hash(i + 17.1), hash(i + 31.7))*.6 + .2;
  return length((f - o)*stretch) - size;
}
// colour of the fruit at p; depth = how far inside the skin (0 on the peel)
vec3 albedo(vec3 p, float depth, out float gloss){
  vec3 q = p - vec3(0., uCy, 0.);
  vec3 u = q/uRad;                             // unit-sphere coordinates
  gloss = .35;
  if (uFruit == 0) {                           // watermelon, long axis x
    if (depth < .04) {
      float a = atan(q.z, q.y);
      float st = sin(a*9. + 3.*fbm(q*2.2) + 1.2*sin(q.x*2.));
      vec3 dk = vec3(.07, .22, .06), lt = vec3(.40, .58, .22);
      gloss = .55; return mix(dk, lt, smoothstep(-.15, .35, st)*(.75 + .25*noise(q*14.)));
    }
    if (depth < .15) return mix(vec3(.80, .89, .62), vec3(.93, .74, .66), smoothstep(.09, .15, depth));
    float ru = length(u);
    vec3 fl = mix(vec3(.90, .17, .2), vec3(.97, .36, .37), .35*fbm(q*9.) + .35*smoothstep(.55, 0., ru));
    if (ru > .38 && ru < .74) {
      float sd = seeds(u, 6.5, vec3(1., 1.9, 1.9), .085);
      if (sd < 0.) return hash(floor(u*6.5) + 5.) < .12 ? vec3(.92, .88, .76) : vec3(.05, .03, .02);
    }
    gloss = .45; return fl;
  }
  if (uFruit == 1) {                           // orange
    if (depth < .05) { gloss = .5; return mix(vec3(.98, .46, .04), vec3(.92, .36, .02), noise(q*42.)); }
    if (depth < .11) return vec3(.98, .92, .76);
    float a = atan(q.z, q.x), rho = length(q.xz);
    if (rho < .08) return vec3(.98, .9, .72);
    float sg = fract(a/6.2831853*11.);
    float mem = min(sg, 1. - sg)*6.2831853/11.*rho;
    if (mem < .011) return vec3(.99, .88, .62);
    gloss = .6;
    return mix(vec3(1., .58, .1), vec3(1., .72, .25), fbm(vec3(a*9., rho*26., q.y*6.)));
  }
  if (uFruit == 2) {                           // apple
    if (depth < .025) {
      float a = atan(q.z, q.x);
      gloss = .65; return mix(vec3(.66, .05, .06), vec3(.93, .72, .2), .55*smoothstep(.55, .85, fbm(vec3(a*7., q.y*1.6, 0.)))*smoothstep(-.6, .2, u.y));
    }
    float a = atan(q.z, q.x), rho = length(q.xz);
    float yc = clamp(1. - abs(q.y)/.55, 0., 1.);             // the core is widest in the middle, closing to the stem
    float core = (.24 + .05*cos(5.*a - 1.57))*sqrt(yc);
    vec3 fl = mix(vec3(.97, .92, .70), vec3(.94, .86, .60), .5*fbm(q*7.));
    if (rho < core) fl = mix(vec3(.90, .86, .62), fl, .45);
    if (yc > 0. && abs(rho - core) < .014) return vec3(.80, .74, .48);
    float sa = fract(a/6.2831853*5. - .25 + .5) - .5;          // five seeds, one facing +z so a cut through the middle shows them
    vec2 sp = vec2(sa*6.2831853/5.*max(rho, .02), rho - .13);
    if (length(vec2(sp.x*2.2, sp.y*2.6)) + abs(q.y + .02)*.55 < .07) return vec3(.36, .2, .08);
    gloss = .5; return fl;
  }
  // kiwi, long axis x
  if (depth < .03) { gloss = .1; return mix(vec3(.38, .26, .13), vec3(.55, .42, .25), noise(q*60.)); }
  float rho = length(u.yz), a = atan(u.z, u.y);
  if (rho < .2) return vec3(.94, .95, .78);
  vec3 fl = mix(vec3(.47, .74, .12), vec3(.32, .58, .07), smoothstep(.25, .95, rho) + .25*noise(vec3(a*40., rho*3., q.x*4.)));
  if (rho > .22 && rho < .44) {                               // a ring of small black seeds around the core
    float fa = a/6.2831853*30., k = floor(fa), jit = hash(vec3(k, floor(q.x*7.), 3.));
    if (length(vec2((fract(fa) - .5)*1.7, (rho - .29 - .07*jit)*15.)) < .45) return vec3(.06, .05, .03);
  }
  gloss = .55; return fl;
}
void main(){
  vec3 rdw = normalize(vW - cameraPosition);
  mat3 Rt = transpose(vR);
  vec3 ro = Rt*(cameraPosition - vP - vO) + vP;
  vec3 rd = Rt*rdw;
  vec3 inv = 1./rd, t0 = (vBmin - ro)*inv, t1 = (vBmax - ro)*inv;
  vec3 tn = min(t0, t1), tf = max(t0, t1);
  float tN = max(max(tn.x, tn.y), tn.z), tF = min(min(tf.x, tf.y), tf.z);
  if (tN > tF || tF < 0.) discard;
  float t = max(tN, 0.);
  vec3 p = ro + rd*t;
  float d = sdf(p);
  vec3 n; float depth;
  if (d < 0.) {                                // entered through a cut face
    n = tN == tn.x ? vec3(-sign(rd.x), 0., 0.) : tN == tn.y ? vec3(0., -sign(rd.y), 0.) : vec3(0., 0., -sign(rd.z));
    depth = -d;
  } else {
    bool hit = false;
    for (int i = 0; i < 48; i++) {
      d = sdf(p);
      if (d < .0012) { hit = true; break; }
      t += max(d, .001);
      if (t > tF) break;
      p = ro + rd*t;
    }
    if (!hit) discard;
    n = nrm(p); depth = 0.;
  }
  float gloss;
  vec3 alb = lin(albedo(p, depth, gloss));
  vec3 nw = normalize(vR*n);
  vec3 hp = vR*(p - vP) + vP + vO;             // the hit in world space
  vec3 L = normalize(vec3(-.45, 1., .55)), V = -rdw, Hh = normalize(L + V);
  float diff = max(dot(nw, L), 0.);
  vec3 amb = mix(vec3(.30, .24, .2), vec3(.62, .66, .74), nw.y*.5 + .5);
  float ao = .5 + .5*smoothstep(0., .45, hp.y);
  float sp = pow(max(dot(nw, Hh), 0.), mix(18., 90., gloss))*gloss*(depth > 0. ? .9 : .7);
  float fr = pow(1. - max(dot(nw, V), 0.), 4.)*.18;
  vec3 col = alb*(amb*.8*ao + diff*vec3(1., .95, .88)*1.25*mix(.6, 1., ao)) + vec3(sp) + fr*vec3(.8, .85, 1.)*ao;
  vec4 clip = projectionMatrix*viewMatrix*vec4(hp, 1.);
  gl_FragDepth = clip.z/clip.w*.5 + .5;
  gl_FragColor = vec4(col, 1.);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

const CAP = SPEC.max_grid;   // pieces per side we actually draw; past this a piece is narrower than a couple of pixels
const unitBox = new THREE.BoxGeometry(1, 1, 1).translate(.5, .5, .5);
function piecesMesh(nx, nz) {
  const cells = [], info = [], seed = [];
  const fx = (i) => -BND.x + 2 * BND.x * i / nx, fz = (j) => -BND.z + 2 * BND.z * j / nz;
  for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) {
    const x0 = fx(i), x1 = fx(i + 1), z0 = fz(j), z1 = fz(j + 1);
    const cx = clamp(0, x0, x1) / BND.x, cz = clamp(0, z0, z1) / BND.z;   // closest point of the cell to the middle
    const s = 1 - cx * cx - cz * cz;
    if (s <= 0) continue;
    const half = BND.y * Math.sqrt(s);
    cells.push(x0, z0, x1, z1); info.push(Math.max(0, CY - half), CY + half, i, j);
    seed.push(((Math.sin(i * 127.1 + j * 311.7) * 43758.5453) % 1 + 1) % 1);
  }
  const g = new THREE.InstancedBufferGeometry(); g.index = unitBox.index; g.setAttribute('position', unitBox.attributes.position);
  g.setAttribute('aCell', new THREE.InstancedBufferAttribute(new Float32Array(cells), 4));
  g.setAttribute('aInfo', new THREE.InstancedBufferAttribute(new Float32Array(info), 4));
  g.setAttribute('aSeed', new THREE.InstancedBufferAttribute(new Float32Array(seed), 1));
  g.instanceCount = seed.length;
  const m = new THREE.ShaderMaterial({ vertexShader: VERT, fragmentShader: FRAG, uniforms: {
    uB: { value: new THREE.Vector2(BND.x, BND.z) }, uDx: { value: 0 }, uDz: { value: 0 }, uGapX: { value: 0 }, uGapZ: { value: 0 },
    uBloom: { value: 0 }, uLoose: { value: 0 }, uDropY: { value: 0 }, uSpread: { value: 0 },
    uFruit: { value: F.id }, uRad: { value: RAD }, uCy: { value: CY } } });
  const mesh = new THREE.Mesh(g, m); mesh.frustumCulled = false; mesh.visible = false; scene.add(mesh);
  return mesh;
}

// ------------------------------------------------------------ the blades: a chef's knife for a few cuts, a grid cutter for many
const steel = new THREE.MeshStandardMaterial({ color: 0xd9dde2, metalness: 1, roughness: .2 });
const knife = new THREE.Group();
{
  const L = 3.9, Hb = .95;

const stages = PLAN.map((s) => {

const cntEl = document.getElementById('cnt'), pcsEl = document.getElementById('pcs');

function renderAt(t) {
