<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';font-weight:500;src:url(fonts/inter-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;src:url(fonts/inter-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:700;src:url(fonts/inter-700-normal.woff2) format('woff2')}
@font-face{font-family:'Inter Tight';font-weight:800;src:url(fonts/inter-tight-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'JB Mono';font-weight:500;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#07090d}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;
  background:radial-gradient(circle at 540px 900px,#1a2232 0,#0d1119 330px,#07090d 720px)}
#glow{position:absolute;left:540px;top:900px;width:1000px;height:1000px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(0,0,0,0) 43%,var(--glow) 44.5%,rgba(0,0,0,0) 53%);opacity:.55}
#c{position:absolute;left:0;top:0;width:1080px;height:1920px;display:block}
#top{position:absolute;left:100px;right:100px;top:250px;text-align:center}
#kicker{font:500 26px/1 'JB Mono';letter-spacing:.18em;color:#8792a3;text-transform:uppercase}
#count{margin-top:26px;font:800 108px/1 'Inter Tight';color:#fff;letter-spacing:-.02em}
#count em{font-style:normal;color:var(--accent)}
#headline{margin-top:26px;font:800 82px/1.04 'Inter Tight';color:#fff;letter-spacing:-.02em}
#bottom{position:absolute;left:100px;right:100px;top:1330px;text-align:center}
#cta{font:800 58px/1.1 'Inter Tight';color:#fff;letter-spacing:-.01em}
#sub{margin-top:16px;font:500 32px/1.3 'Inter';color:#8792a3}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;opacity:0;text-shadow:0 2px 10px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9)}
.lbl b{display:block;font:700 30px/1.1 'Inter';color:#fff}
.lbl span{display:block;margin-top:4px;font:500 22px/1 'JB Mono';color:var(--accent)}
.lbl.home b{font-size:28px;color:#fff}
.lbl.home span{color:#8792a3}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-fps="30" data-width="1080" data-height="1920">
<div id="glow"></div>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="labels"></div>
<div id="top"><div id="kicker"></div><div id="count"></div><div id="headline"></div></div>
<div id="bottom"><div id="cta"></div><div id="sub"></div></div>
<script type="module">
import * as THREE from "three";

const SPEC = __SPEC__;
const LAND = SPEC.land;                                  // [lat*10, lon*10, ...] dots on land (land.json, from make_land.mjs)
const W = 1080, H = 1920;
const ACC = SPEC.accent;
const root = document.documentElement;
root.style.setProperty('--accent', ACC);
const ac = new THREE.Color(ACC);
root.style.setProperty('--glow', `rgba(${ac.r * 255 | 0},${ac.g * 255 | 0},${ac.b * 255 | 0},.10)`);

// ------------------------------------------------------------ timing
const T_SPIN0 = .8, T_SPIN1 = 9.8, T_LAST = 9.2;        // the globe turns once between T_SPIN0 and T_SPIN1
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const spinP = (t) => { const u = clamp((t - T_SPIN0) / (T_SPIN1 - T_SPIN0), 0, 1); return .5 * u + .5 * u * u * (3 - 2 * u); };
const spinInv = (p) => { let lo = T_SPIN0, hi = T_SPIN1; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; spinP(m) < p ? lo = m : hi = m; } return lo; };

// ------------------------------------------------------------ scene
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1); renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, W / H, .1, 100);
camera.position.set(0, 0, 8.2); camera.lookAt(0, 0, 0);
const GY = .14;                                          // globe centre sits a little above the middle of the frame
const globe = new THREE.Group(); globe.position.y = GY; globe.rotation.order = 'XYZ'; scene.add(globe);

const D2R = Math.PI / 180;
const vec = (lat, lon, r = 1) => { const p = lat * D2R, l = lon * D2R; return new THREE.Vector3(r * Math.cos(p) * Math.sin(l), r * Math.sin(p), r * Math.cos(p) * Math.cos(l)); };

const body = new THREE.Mesh(new THREE.SphereGeometry(.993, 96, 64), new THREE.MeshBasicMaterial({ color: 0x0f141c }));
globe.add(body);

// land dots: round points, brighter where they face the camera
const lp = new Float32Array(LAND.length / 2 * 3);
for (let i = 0; i < LAND.length; i += 2) vec(LAND[i] / 10, LAND[i + 1] / 10, 1.0).toArray(lp, i / 2 * 3);
const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.BufferAttribute(lp, 3));
const dotMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uSize: { value: 5.2 } },
  vertexShader: `uniform float uSize; varying float vF;
    void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0);
      vec3 n = normalize(normalMatrix * position); vF = dot(n, normalize(-mv.xyz));
      gl_PointSize = uSize; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `varying float vF;
    void main(){ vec2 c = gl_PointCoord - .5; float d = length(c); if (d > .5) discard;
      float a = smoothstep(.5, .36, d) * smoothstep(.05, .3, vF);
      vec3 col = mix(vec3(.17,.20,.25), vec3(.58,.63,.71), smoothstep(.1, .95, vF));
      gl_FragColor = vec4(col, a); }`,
});
globe.add(new THREE.Points(lg, dotMat));

// ------------------------------------------------------------ home and cities
const HOME = SPEC.home;
const hv = vec(HOME.lat, HOME.lon, 1.0);
const TILT = clamp(HOME.lat, -35, 35) * .7 * D2R;       // lean the globe so home sits near the middle

const flatDisc = (r, color, opacity = 1) => {
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 40), new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false, side: THREE.DoubleSide }));
  return m;
};
const ring = (color) => new THREE.Mesh(new THREE.RingGeometry(.8, 1, 48), new THREE.MeshBasicMaterial({ color, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
const placeOn = (m, v, r) => { m.position.copy(v.clone().setLength(r)); m.lookAt(v.clone().multiplyScalar(3)); globe.add(m); return m; };

const homeDot = placeOn(flatDisc(.016, 0xffffff), hv, 1.004);
const homeRing = placeOn(ring(0xffffff), hv, 1.003);

// group repeat cities, keep the commenters
const byName = new Map();
for (const c of SPEC.cities) {
  const k = c.name.trim().toLowerCase();
  if (!byName.has(k)) byName.set(k, { name: c.name.trim(), lat: +c.lat, lon: +c.lon, by: [] });
  const by = [].concat(c.by || []).filter(Boolean);
  byName.get(k).by.push(...by);
  if (!by.length) byName.get(k).by.push(null);
}
const CITIES = [...byName.values()];
const nPeople = CITIES.reduce((s, c) => s + c.by.length, 0);

const labelsEl = document.getElementById('labels');
const mkLabel = (name, sub, cls = '') => {
  const d = document.createElement('div'); d.className = 'lbl ' + cls;
  d.innerHTML = '<b></b><span></span>'; d.firstChild.textContent = name; d.lastChild.textContent = sub || '';
  if (!sub) d.lastChild.remove();
  labelsEl.appendChild(d); return d;
};
const homeLbl = mkLabel(HOME.name, 'home', 'home');

const arcs = CITIES.map((c) => {
  const cv = vec(c.lat, c.lon, 1.0);
  const ang = hv.angleTo(cv);
  const h = .025 + .17 * ang / Math.PI;
  const pts = [];
  for (let i = 0; i <= 64; i++) {
    const u = i / 64;
    const p = new THREE.Vector3().copy(hv).lerp(cv, u);
    if (p.lengthSq() < 1e-6) p.copy(hv);                // antipodes: never in practice
    // slerp, then lift
    const s = ang < 1e-4 ? hv.clone() : hv.clone().multiplyScalar(Math.sin((1 - u) * ang) / Math.sin(ang)).add(cv.clone().multiplyScalar(Math.sin(u * ang) / Math.sin(ang)));
    pts.push(s.setLength(1.002 + h * Math.sin(Math.PI * u)));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const SEG = 120, RAD = 6;
  const line = new THREE.Mesh(new THREE.TubeGeometry(curve, SEG, .0042, RAD, false), new THREE.MeshBasicMaterial({ color: ACC, transparent: true, depthWrite: false }));
  const glow = new THREE.Mesh(new THREE.TubeGeometry(curve, SEG, .011, RAD, false), new THREE.MeshBasicMaterial({ color: ACC, transparent: true, opacity: .16, depthWrite: false, blending: THREE.AdditiveBlending }));
  globe.add(glow, line);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(.013, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  globe.add(tip);
  const dot = placeOn(flatDisc(.013, ACC), cv, 1.004);
  const pulse = placeOn(ring(ACC), cv, 1.003);
  // launch so the arc lands about when the city turns to face the camera
  let d = ((c.lon - HOME.lon) % 360 + 360) % 360;
  const dur = .55 + .75 * ang / Math.PI;
  let t0 = d - 55 > 0 ? spinInv((d - 55) / 360) : T_SPIN0 + .2 + d / 360;
  t0 = Math.min(t0, T_LAST - dur);
  const who = c.by.filter(Boolean);
  const sub = who.length ? (who.length > 1 ? `${who[0]} +${who.length - 1}` : who[0]) : (c.by.length > 1 ? `${c.by.length} people` : '');
  return { c, cv, curve, line, glow, tip, dot, pulse, t0, t1: t0 + dur, SEG, RAD, el: mkLabel(c.name, sub) };
});

// ------------------------------------------------------------ text
const kicker = document.getElementById('kicker'), count = document.getElementById('count'), headline = document.getElementById('headline');
const cta = document.getElementById('cta'), sub = document.getElementById('sub');
const EMPTY = CITIES.length === 0;
kicker.textContent = SPEC.kicker || (SPEC.week ? `Week ${SPEC.week} · from ${HOME.name}` : `From ${HOME.name}`);
headline.textContent = EMPTY ? (SPEC.headline || 'Where are you watching from?') : '';
cta.textContent = SPEC.cta || 'Comment your city';
sub.textContent = SPEC.sub || (EMPTY ? "I'll fly to every one next week" : "Next week's map flies to you");
if (EMPTY) count.remove(); else headline.remove();

const wp = new THREE.Vector3(), cam = camera.position, gc = new THREE.Vector3(0, GY, 0);
const facing = (obj) => { obj.getWorldPosition(wp); const n = wp.clone().sub(gc).normalize(); return n.dot(cam.clone().sub(wp).normalize()); };
const project = (obj, lift = 0) => { obj.getWorldPosition(wp); wp.add(wp.clone().sub(gc).setLength(lift)); wp.project(camera); return [(wp.x + 1) / 2 * W, (1 - wp.y) / 2 * H]; };
let placed = [];                                          // labels already on screen this frame
const placeLabel = (el, obj, a) => {
  el.style.opacity = a.toFixed(3);
  if (a < .01) return;
  const [x, y] = project(obj, .01);
  const w = el.offsetWidth, h = el.offsetHeight;
  const sides = x + 22 + w > 1000 ? [x - 22 - w, x + 22] : [x + 22, x - 22 - w];   // prefer the right, flip near the edge
  let best = null;
  for (const dy of [0, h * .6, -h * .6, h * 1.2, -h * 1.2]) for (const lx of sides) {
    const r = [clamp(lx, 60, 1020 - w), y - h / 2 + dy, w, h];
    const hit = placed.some((q) => r[0] < q[0] + q[2] + 8 && q[0] < r[0] + r[2] + 8 && r[1] < q[1] + q[3] && q[1] < r[1] + r[3]);
    if (!hit) { best = r; break; }
    if (!best) best = r;
    if (best && !hit) break;
  }
  placed.push(best);
  el.style.transform = `translate(${best[0].toFixed(1)}px,${best[1].toFixed(1)}px)`;
};

// ------------------------------------------------------------ frame
function renderAt(t) {
  const p = spinP(t);
  globe.rotation.set(TILT, -HOME.lon * D2R - p * Math.PI * 2, 0);
  const zoom = 1 + .05 * smooth(0, 1.2, t) - .06 * smooth(T_SPIN1 - .6, T_SPIN1 + 1.2, t);
  globe.scale.setScalar(.94 * zoom);
  globe.updateMatrixWorld(true);

  placed = [];
  // home pulse
  const hp = (t * .9) % 1;
  homeRing.scale.setScalar(.018 + hp * .05); homeRing.material.opacity = .7 * (1 - hp);
  homeDot.scale.setScalar(smooth(.1, .4, t));
  const hf = facing(homeDot);
  placeLabel(homeLbl, homeDot, smooth(.25, .6, t) * (1 - smooth(1.8, 2.3, t) + smooth(T_SPIN1 - .2, T_SPIN1 + .4, t)) * smooth(.2, .45, hf));

  let landed = 0;
  for (const a of arcs) {
    const pr = clamp((t - a.t0) / (a.t1 - a.t0), 0, 1);
    const e = 1 - Math.pow(1 - pr, 2.2);
    const k = Math.floor(e * a.SEG) * a.RAD * 6;
    a.line.geometry.setDrawRange(0, k); a.glow.geometry.setDrawRange(0, k);
    a.line.visible = a.glow.visible = pr > 0;
    a.line.material.opacity = 1 - .45 * smooth(a.t1 + .4, a.t1 + 1.6, t);
    a.tip.visible = pr > 0 && pr < 1;
    a.tip.position.copy(a.curve.getPointAt(Math.max(.001, e)));
    const lt = t - a.t1;
    a.dot.visible = lt > 0;
    a.dot.scale.setScalar(lt > 0 ? 1 + .6 * Math.sin(Math.PI * clamp(lt / .3, 0, 1)) : 0);
    const pp = clamp(lt / .9, 0, 1);
    a.pulse.visible = lt > 0 && pp < 1;
    a.pulse.scale.setScalar(.012 + pp * .07); a.pulse.material.opacity = .9 * (1 - pp);
    if (lt > 0) landed++;
    const f = facing(a.dot);
    const show = smooth(0, .25, lt) * (1 - smooth(1.5, 2.0, lt)) * smooth(.25, .5, f);
    placeLabel(a.el, a.dot, show);
  }

  if (!EMPTY) {
    const n = landed;
    count.innerHTML = `<em>${n}</em> ${n === 1 ? 'city' : 'cities'}`;
  }
  document.getElementById('top').style.opacity = smooth(.1, .5, t);
  const b = document.getElementById('bottom');
  const ba = EMPTY ? smooth(.6, 1.0, t) : smooth(T_SPIN1 - .3, T_SPIN1 + .2, t);
  b.style.opacity = ba; b.style.transform = `translateY(${(1 - ba) * 24}px)`;

  renderer.render(scene, camera);
}
window.addEventListener('hf-seek', (e) => renderAt(e.detail.time));
renderAt(window.__hfThreeTime || 0);
</script>
</div>
</body></html>
